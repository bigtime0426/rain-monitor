name: probe

# 手動啟動：從 GitHub 的機器測一次各候選資料來源連不連得到
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install requests

      - name: 探測資料來源
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: |
          python probe.py
          cat probe_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 存回報告
        run: |
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add probe_report.md
          git diff --cached --quiet && exit 0
          git commit -m "probe report"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "存回失敗（報告仍在上方執行摘要裡）"
          exit 0
