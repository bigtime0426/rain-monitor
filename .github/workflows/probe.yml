name: probe
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python probe.py
      - name: Commit result
        run: |
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add probe_result.txt
          git diff --cached --quiet || (git commit -m "probe result" && git pull --rebase && git push)
