name: probe-stock2

# 手動啟動：台股第二輪探測（診斷上櫃收盤行情、測歷史資料回補），不需要任何金鑰
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-stock2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install requests

      - name: 第二輪探測
        run: python probe_stock2.py

      - name: 存回報告
        run: |
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add stock_samples2.md
          git diff --cached --quiet && exit 0
          git commit -m "stock samples 2"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "存回失敗（報告仍在上方日誌裡）"
          exit 0
