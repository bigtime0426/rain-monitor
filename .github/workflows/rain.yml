name: rain-monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '1 = 強制檢查所有鏡頭（測試用）'
        default: '1'
      test_mail:
        description: '1 = 另外寄一封測試通知信'
        default: '0'
      discover:
        description: '1 = 立刻重新找一次鏡頭（平常每 7 天自動更新）'
        default: '0'

permissions:
  contents: write

concurrency:
  group: rain-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: |
          pip install requests
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: 自動找鏡頭（每 7 天更新一次，失敗不影響盯雨）
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          FORCE_DISCOVER: ${{ github.event.inputs.discover || '0' }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python discover.py || true

      - name: 執行盯雨
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          TEST_MAIL: ${{ github.event.inputs.test_mail || '0' }}
          MAIL_URL: ${{ secrets.MAIL_URL }}
          MAIL_TOKEN: ${{ secrets.MAIL_TOKEN }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python monitor.py

      - name: 存回紀錄
        run: |
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git rm -r --cached __pycache__ -q 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "rain log"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "存回失敗（已重試 3 次）"
          exit 1
